map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
}

map $uri $cache_policy {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "no-store";
    ~^/(robots\.txt|sitemap\.xml)$ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    # Re-resolve the service after Compose replaces the API container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $api_upstream api:8000;
    client_max_body_size 100k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.google.com https://bauval.org https://*.bauval.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pagead2.googlesyndication.com https://*.google.com https://bauval.org https://*.bauval.org; font-src 'self' data:; connect-src 'self' https://pagead2.googlesyndication.com https://*.google.com https://bauval.org https://*.bauval.org; frame-src 'self' https://googleads.g.doubleclick.net https://*.google.com https://bauval.org https://*.bauval.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /index.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Vary "Accept" always;
        add_header x-markdown-tokens "360" always;
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
    }

    # RFC 9727 API Catalog
    location = /.well-known/api-catalog {
        default_type "application/linkset+json; charset=utf-8";
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Auth.md discovery
    location = /auth.md {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # RFC 9728 OAuth Protected Resource Metadata
    location = /.well-known/oauth-protected-resource {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # OAuth / OIDC Discovery & Bot Auth
    location ~* ^/\.well-known/(openid-configuration|oauth-authorization-server|agent-card\.json|jwks\.json|http-message-signatures-directory)$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Agent Skills Discovery
    location = /.well-known/agent-skills/index.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SEP-1649 MCP Server Cards
    location ~* ^/\.well-known/mcp/.*\.json$ {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/mcp.json {
        default_type "application/json; charset=utf-8";
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Skill markdown artifacts
    location /skills/ {
        default_type "text/markdown; charset=utf-8";
        types { text/markdown md; }
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    # Swagger's standard distribution uses a CDN and an inline initialization script.
    # Limit that exception to the documentation page; the app retains its self-only policy.
    location = /api/docs {
        proxy_pass http://$api_upstream$request_uri;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-store always;
    }

    location /api/ {
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_buffering off;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        types { text/plain txt; }
        default_type text/plain;
        try_files $uri =404;
    }

    location = /ads.txt {
        types { text/plain txt; }
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        try_files $uri =404;
    }

    location = /robots {
        return 301 /robots.txt;
    }

    location = /sitemap {
        return 301 /sitemap.xml;
    }

    location / {
        if ($wants_markdown) {
            rewrite ^ /index.md last;
        }
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc", </api/docs>; rel="service-doc", </.well-known/oauth-protected-resource>; rel="describedby"' always;
        add_header Vary "Accept" always;
    }
}
