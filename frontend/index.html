    <script>
      (() => {
        function registerWebMcpTools() {
          if (!('modelContext' in navigator) || !navigator.modelContext) return;
          try {
            const controller = new AbortController();
            navigator.modelContext.registerTool({
              name: 'search_leetbug',
              title: 'Search LeetBug',
              description: 'Search coding problems, debugging challenges, and bug reports on LeetBug.',
              inputSchema: {
                type: 'object',
                properties: {
                  query: { type: 'string', description: 'Search term for coding problems or bugs' }
                },
                required: ['query']
              },
              execute: async ({ query }) => {
                return {
                  content: [{ type: 'text', text: `Results for ${query}: Visit https://leetbug.nevatal.id/problems` }]
                };
              }
            }, { signal: controller.signal });
          } catch (e) {}
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registerWebMcpTools);
        } else {
          registerWebMcpTools();
        }
      })();
    </script>
    <meta name="description" content="Become the engineer who finds the fix. Practice real-world debugging with LeetBug." />
    <title>LeetBug — Find the fix.</title>
