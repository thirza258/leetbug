name: Verify LeetBug

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -e './backend[dev]' -c backend/requirements.lock
      - run: ruff check backend
      - run: pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose up -d --build --wait --wait-timeout 900
      - run: docker compose exec -T worker python -m app.verify_catalog
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail=150
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
      - if: always()
        run: docker compose down

